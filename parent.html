<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF5FA">
<title>讀書狀況・家長版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  家長版（2026-11-07）：
  - 看：讀孩子讀書網站自動備份到 GitHub Gist 的那份資料（沒登入的 API），不需要 token。Gist ID 從家長連結 #g=… 帶進來，只存在這台裝置。
  - 寵物：用 iframe 打開 index.html?pv=1，資料放在記憶體，怎麼點都不會改到孩子的資料。
  - 互動（摸摸、留言、加點每天最多 30）：寫進孩子帳號裡另一個 Gist「家長頻道」（study-plan-parent.json），
    要先在這支手機貼一個 GitHub token（Gists 讀寫）；孩子的網站同步時讀回來套用。絕不寫孩子的備份 Gist。
  - 不顯示成績（孩子 2026-10-26 說不要給爸媽看成績）。
  - 11-10 加詳細（孩子：「家長頁面再改的詳細一點，不然我爸會一直跑來問我」）：現在在做什麼（番茄鐘、現在的時段、最後一次打勾）、
    每項任務幾點打勾、今天各科幾分鐘、進度跟欠帳（分科落後、考古題寫幾份、講義到哪）、明天的日程、未來 7 天。一樣只讀、不顯示分數。
-->
<style>
:root{
  --ink:#131C26; --ink-soft:#4E5B67; --ink-faint:#6B7782;
  --paper:#EEF5FA; --card:#FFFFFF; --rule:#D6E0E8;
  --sky:#1C7EBB; --sky-tint:#E2F0F9;
  --ok:#0D7F63; --ok-tint:#E3F2EC;
  --warn:#A65A0C; --warn-tint:#FBEEDF;
  --bad:#B83227; --bad-tint:#FBE8E6;
  --bar:#3A9AD9; --bar-empty:#DCE6EE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EDF3; --ink-soft:#B4C0CB; --ink-faint:#8B98A5;
    --paper:#0F171E; --card:#17222C; --rule:#2A3742;
    --sky:#62B7EC; --sky-tint:#15303F;
    --ok:#4CC3A0; --ok-tint:#12302A;
    --warn:#E39B4F; --warn-tint:#33261A;
    --bad:#F07A6E; --bad-tint:#3A1F1C;
    --bar:#5DB4EA; --bar-empty:#26333E;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EDF3; --ink-soft:#B4C0CB; --ink-faint:#8B98A5;
  --paper:#0F171E; --card:#17222C; --rule:#2A3742;
  --sky:#62B7EC; --sky-tint:#15303F;
  --ok:#4CC3A0; --ok-tint:#12302A;
  --warn:#E39B4F; --warn-tint:#33261A;
  --bad:#F07A6E; --bad-tint:#3A1F1C;
  --bar:#5DB4EA; --bar-empty:#26333E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.65;padding:0 16px 48px}
.wrap{max-width:640px;margin:0 auto}
header{padding:22px 0 10px}
h1{font-size:21px;margin:0;letter-spacing:.02em}
.eyebrow{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0}
.fresh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-soft)}
.fresh b{font-family:'IBM Plex Mono',monospace;font-weight:600}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px}
.btn:hover{border-color:var(--sky);color:var(--sky)}
.btn.solid{background:var(--sky);border-color:var(--sky);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{border-radius:12px;padding:10px 14px;font-size:13.5px;margin:12px 0 0}
.note.warn{background:var(--warn-tint);color:var(--warn)}
.note.bad{background:var(--bad-tint);color:var(--bad)}
.note.ok{background:var(--ok-tint);color:var(--ok)}
.note.info{background:var(--sky-tint);color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font-size:16px;margin:0 0 2px}
.card .sub{font-size:12.5px;color:var(--ink-faint);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.tile{background:var(--paper);border-radius:12px;padding:10px 10px 8px;min-width:0}
.tile .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;line-height:1.2;color:var(--ink)}
.tile .v small{font-size:13px;color:var(--ink-faint);font-weight:400}
.tile .k{font-size:12px;color:var(--ink-faint)}
.now{font-size:13.5px;color:var(--ink-soft);margin:6px 0 2px}
ul.tasks{list-style:none;margin:8px 0 0;padding:0}
ul.tasks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 6px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px}
ul.tasks li .ic{font-size:14px;line-height:1.6;text-align:center}
ul.tasks li .n{overflow-wrap:anywhere}
ul.tasks li .m{display:block;font-size:12px;color:var(--ink-faint)}
ul.tasks li.done .n{color:var(--ink-soft)}
.tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:1px}
.tag.bk{background:var(--warn-tint);color:var(--warn)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.wait{background:var(--sky-tint);color:var(--sky)}
.chk{padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.chk .d{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);margin-right:6px}
.chk .s{display:block;font-size:12.5px;margin-top:1px}
.chk .s.ok{color:var(--ok)} .chk .s.wait{color:var(--sky)} .chk .s.bad{color:var(--bad);font-weight:500}
.ex{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.ex b{font-family:'IBM Plex Mono',monospace;color:var(--sky)}
/* 11-10：現在在做什麼、各科分鐘、進度跟欠帳、明天、未來 7 天 */
.live{background:var(--paper);border-radius:12px;padding:8px 12px;margin:8px 0 6px;font-size:13.5px;color:var(--ink-soft)}
.live p{margin:0;padding:2px 0;overflow-wrap:anywhere}
.live b{color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:4px 6px;margin:4px 0 2px}
.cats span{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--ink-soft)}
.cats b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink)}
ul.tasks li .m .at{color:var(--ok)}
.pg-h{font-size:13.5px;font-weight:700;margin:14px 0 2px}
.pg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--rule);font-size:14px}
.pg>span:first-child{overflow-wrap:anywhere}
.pg .v{font-size:13px;text-align:right;white-space:nowrap;color:var(--ink-soft)}
.pg .v b{font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.pg small{grid-column:1/-1;font-size:12px;color:var(--ink-faint)}
.pg .behind,.pg .behind b{color:var(--bad);font-weight:600}
.pg .fine{color:var(--ok)}
ul.sched{list-style:none;margin:6px 0 0;padding:0}
ul.sched li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 8px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
ul.sched li .tm{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);line-height:1.95;white-space:nowrap}
ul.sched li .n{overflow-wrap:anywhere}
ul.sched li.dim{font-size:13px;color:var(--ink-faint)}
ul.sched.mins li{grid-template-columns:52px minmax(0,1fr)}
details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-size:13px;color:var(--sky)}
details.day{border-top:1px solid var(--rule);padding:7px 0}
details.day>summary{cursor:pointer;list-style:none;font-size:14px;position:relative;padding-right:20px}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:'▾';position:absolute;right:2px;top:0;color:var(--ink-faint)}
details.day[open]>summary::after{content:'▴'}
details.day .ds{display:inline-block;white-space:nowrap;font-size:12.5px;color:var(--ink-faint);margin-left:6px}
details.day ul.sched{margin-top:4px}
details.day .dn{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg .tag{margin:0}
.tag.ex{background:var(--bad-tint);color:var(--bad)}
.tag.nt{background:var(--paper);color:var(--ink-soft)}
.tag.lt{background:var(--warn-tint);color:var(--warn)}
/* 寵物 */
.pet-top{display:flex;gap:12px;align-items:center}
.pet-face{width:56px;height:56px;border-radius:16px;background:var(--sky-tint);display:grid;place-items:center;font-size:32px;flex:none}
.pet-name{font-size:16px;font-weight:700}
.pet-st{font-size:12.5px;color:var(--ink-faint)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.meter{font-size:12px;color:var(--ink-faint)}
.meter b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-size:14px}
.meter .bar{height:6px;border-radius:99px;background:var(--bar-empty);overflow:hidden;margin-top:3px}
.meter .bar i{display:block;height:100%;background:var(--bar);border-radius:99px}
.meter.low .bar i{background:var(--bad)}
#pv-box iframe{display:block;width:100%;border:0;border-radius:12px;background:var(--paper);margin-top:10px}
/* 互動 */
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.act{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 6px;font-size:13.5px;line-height:1.35;text-align:center}
.act span{display:block;font-size:22px}
.act small{display:block;font-size:11.5px;color:var(--ink-faint)}
.act[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-tint)}
.acts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:420px){ .acts.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.say{margin:10px 0 0;font-size:14px;background:var(--paper);border-radius:12px;padding:8px 12px;color:var(--ink-soft)}
.form{margin-top:10px;background:var(--paper);border-radius:12px;padding:12px}
.form label{display:block;font-size:13px;margin:0 0 6px;color:var(--ink-soft)}
.form input[type=text],.form input[type=password],.setup input{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.chips button:disabled{opacity:.4}
.alog{list-style:none;margin:10px 0 0;padding:0}
.alog li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--rule);font-size:13px}
.alog li small{font-size:11.5px;color:var(--ink-faint)}
.alog li .st{font-size:12px;text-align:right;white-space:nowrap}
.setup label{display:block;font-size:13.5px;margin:10px 0 6px}
.setup ol{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink-soft)}
details.fold summary{cursor:pointer;font-size:16px;font-weight:700;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:'▾';float:right;color:var(--ink-faint)}
details.fold[open] summary::after{content:'▴'}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;max-width:608px;margin:0 auto;background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;font-size:13.5px;text-align:center}
footer{font-size:12px;color:var(--ink-faint);margin-top:22px;line-height:1.7}
@media (max-width:380px){ .tile .v{font-size:19px} .act{font-size:12.5px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>joshdaai 的讀書狀況</h1>
    <p class="eyebrow">家長版・資料來自他讀書網站的自動備份</p>
    <div class="fresh" id="fresh"></div>
  </header>
  <div id="app"><p class="note info">讀取中…</p></div>
  <footer>
    這一頁讀的是孩子讀書網站自動上傳的備份：他打開網站、勾了任務，幾秒內就會上傳；這頁每 10 分鐘自動更新一次（也可以按「重新整理」）。網站沒打開的時候，這裡不會變。
    讀書時間：那天有番茄鐘就算番茄鐘，沒有才算完成任務的表定時間。這裡只看讀書進度，不顯示成績。<br>
    <button class="btn" id="forget" type="button" style="margin-top:8px">清掉這台裝置記住的連結</button>
  </footer>
</div>
<script src="plan.js"></script>
<script src="daychart.js?v=20261110a"></script>
<script>
(function(){
  var GK='parent.gist.v1', CK='parent.chan.v1', FILE='study-plan-backup.json', PFILE='study-plan-parent.json', OWNER='joshdaaicode';
  var CHECK_DAYS=3, LATE_PEN=5, PAR_MAX=30, PAT_MAX=5;
  var WD='日一二三四五六';
  var SPECIES={cat:['貓','🐱'],dog:['狗','🐶'],hamster:['倉鼠','🐹'],rabbit:['兔子','🐰'],fox:['狐狸','🦊'],panda:['熊貓','🐼'],penguin:['企鵝','🐧'],chick:['小雞','🐥']};
  var app=document.getElementById('app'), fresh=document.getElementById('fresh');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }
  function d0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function key(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function pk(k){ var p=String(k).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function md(k){ var p=String(k).split('-'); return (+p[1])+'/'+(+p[2]); }
  function days(a,b){ return Math.round((b-a)/864e5); }
  function addD(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function hm(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function ago(t){ var m=Math.round((Date.now()-t)/60000); if(m<1) return '剛剛'; if(m<60) return m+' 分鐘前'; var h=Math.floor(m/60); if(h<24) return h+' 小時前'; return Math.floor(h/24)+' 天前'; }
  function J(o,k,dflt){ try{ var v=o[k]; if(v==null) return dflt; var x=typeof v==='string'?JSON.parse(v):v; return x==null?dflt:x; }catch(e){ return dflt; } }
  var tt=null;
  function toast(m){ var t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; clearTimeout(tt); tt=setTimeout(function(){ t.remove(); },3200); }

  // ---- 11-10：詳細版用的小工具 ----
  // 科目名稱：daychart.js 沒有匯出，這裡照讀書網站（index.html 分科進度）那份抄；番茄鐘科目 DayChart 以後有匯出就用它的
  var CATN={chi:'國文',math:'數學',eng:'英文',sci:'自然',soc:'社會',kb:'科班考古題',kbfix:'科班訂正',kbr:'科班複習',
    hw:'補習作業',mock:'模考／訂正',term:'段考',fu:'複試',other:'其他'};
  var PG_CATS=Object.keys(CATN);   // 分科進度只看這幾類（跟讀書網站「分科進度」同一份）
  var POMO_SUBJ=(window.DayChart&&window.DayChart.POMO_SUBJ)||{chi:'國文',math:'數學',eng:'英文',sci:'自然',soc:'社會',kbm:'科班資優數學',kbs:'科班自然學科'};
  var BOOK_SUBJ={chi:'國文',m1:'數學',m2:'數學',e1:'英文',e2:'英文',phy:'理化',bio:'生物',ear:'地科',his:'歷史',geo:'地理',civ:'公民',mock:'會考',past:'會考',A:'科班',B:'科班'};
  var BOOK_TITLE={A:'P&C 科學班歷屆試題Q（112–114 南一中、嘉中、彰中）', B:'P&C 科學班歷屆試題Q（112–114 中一中、武陵、建中、北一女）'};
  function hhmm(t){ var d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function toMin(s){ var p=String(s).split(':'); return (+p[0])*60+(+p[1]); }
  function fmtMin(m){ m=Math.round(m); return m>=60?Math.floor(m/60)+' 小時'+(m%60?' '+(m%60)+' 分':''):m+' 分'; }
  // 某一天的時段：那天孩子手動改過（plan.dayedit.v1）就用改過的，否則用 plan.js（跟讀書網站 dayTpl 同一個順序）
  // 回傳 [{s:'18:15', e:'19:45', m:分鐘, c:類別, n:名稱, f:0 讀書 1 固定 2 生活 3 娛樂／空檔}]
  function dayBlocks(de,k){
    if(de && Array.isArray(de[k])) return de[k].map(function(x){
      var t=String(x.t||''), r=t.match(/(\d{1,2}:\d{2})\s*[–~-]\s*(\d{1,2}:\d{2})/), s=r?r[1]:((t.match(/\d{1,2}:\d{2}/)||[''])[0]), e=r?r[2]:'';
      return {s:s, e:e, m:+x.m||0, c:x.c||'other', n:String(x.n==null?'':x.n), f:x.l?2:(x.f?1:(x.e?3:0)), ed:1}; });
    var d=window.PLAN&&window.PLAN.days&&window.PLAN.days[k]; if(!d) return [];
    return (d.b||[]).map(function(b){ var whole=b[0]==='—'; return {s:whole?'':b[0], e:whole?'':b[1], m:0, c:b[2], n:String(b[3]), f:b[5]}; });
  }
  function blkMin(b){ if(b.m) return b.m; if(!b.s||!b.e) return 0; var d=toMin(b.e)-toMin(b.s); return d<0?d+1440:d; }
  function blkTime(b){ return b.s?(b.e?b.s+'–'+b.e:b.s):'整天'; }
  var PDAYS=null;   // plan.js 的所有日子（排好順序；plan.js 不會變，算一次就好）
  function planDays(){ if(!PDAYS) PDAYS=Object.keys((window.PLAN&&window.PLAN.days)||{}).sort(function(a,b){ return pk(a)-pk(b); }); return PDAYS; }
  // 接下來的考試（「接下來的考試」和「未來 7 天」共用）
  function upcomingExams(today){
    var EX=((window.PLAN&&window.PLAN.exams)||[]).filter(function(e){ return !/第二天/.test(e[3]); }).map(function(e){ return {n:e[3].replace(/ 第一天$/,''), d:new Date(e[0],e[1]-1,e[2])}; })

  // 11-10：進度跟欠帳。分科進度、講義進度、考古題份數的算法跟讀書網站「紀錄 → 進度」一樣
  // （index.html 的 paintSubjects／paintBooks／paintKbPace），兩邊的數字才對得上。只算段數、份數，不看分數。
  function progress(o,st,today){
    var PL=window.PLAN||{}, tk=key(today), de=J(o,'plan.dayedit.v1',{}), D=planDays(), SB={};
    D.forEach(function(k){ SB[k]=dayBlocks(de,k).filter(function(b){ return b.f===0; }); });
    // 每天的紀錄，再把他手機上目前清單那一天併進去（還沒換日的那天不在紀錄裡；跟讀書網站 allHist 一樣）
    var h=Object.assign({},J(o,'plan.hist.v1',{}));
    if(st.day){
      var real=(st.list||[]).filter(function(x){ return !x.pre && !x.f; }), dn=st.done||{}, cat={};
      real.forEach(function(x){ var c=x.c||'other', q=cat[c]=cat[c]||{a:0,d:0}; q.a++; if(dn[x.id]) q.d++; });
      h[st.day]=Object.assign({},h[st.day]||{},{cat:cat, dn:real.filter(function(x){ return dn[x.id]; }).map(function(x){ return x.n; })});
    }
    // 分科：照計畫從開始記錄那天到昨天應完成幾段 vs. 實際完成幾段（今天做完的也算）
    var tracked=Object.keys(h).filter(function(k){ return h[k]&&h[k].cat; }).sort(function(a,b){ return pk(a)-pk(b); });
    var from=tracked.length?pk(tracked[0]):today, plan={}, done={};
    D.forEach(function(k){ var d=pk(k); if(d<from||d>=today) return; SB[k].forEach(function(b){ plan[b.c]=(plan[b.c]||0)+1; }); });
    Object.keys(h).forEach(function(k){ var c=h[k]&&h[k].cat; if(!c) return; Object.keys(c).forEach(function(x){ done[x]=(done[x]||0)+(+(c[x]&&c[x].d)||0); }); });
    var subj=PG_CATS.filter(function(c){ return plan[c]||done[c]; }).map(function(c){ var p=plan[c]||0, n=done[c]||0; return {c:c, p:p, dn:n, beh:Math.max(0,p-n)}; })
      .sort(function(a,b){ return b.beh-a.beh; });
    // 科班考古題：寫完幾份（只數份數）；照計畫到昨天應寫完哪幾份
    var ks=J(o,'plan.kbscore.v1',{}), got=Object.keys(ks).filter(function(k){ return k.charAt(0)!=='_' && ks[k] && ks[k].d; }).length, exp={};
    D.forEach(function(k){ if(pk(k)>=today) return; SB[k].forEach(function(b){ var m=b.n.match(/^科班考古｜(\S+) (\d{3}) (\S+) 限時作答/); if(m && !/前半/.test(b.n)) exp[m[1]+' '+m[2]+' '+m[3]]=1; }); });
    var miss=Object.keys(exp).filter(function(k){ return !(ks[k]&&ks[k].d); });
    // 講義／題本：排程裡名稱有書名的每一段；那段的名稱出現在任何一天的完成清單裡就算完成
    var idx={}; Object.keys(h).forEach(function(k){ ((h[k]&&h[k].dn)||[]).forEach(function(n){ idx[n]=1; }); });
    var books=Object.keys(PL.books||{}).map(function(bk){
      var t=PL.books[bk], segs=[];
      D.forEach(function(k){ SB[k].forEach(function(b){ var n=b.n, i=n.indexOf(t); if(i<0) return; if(/可對照/.test(n) && n.indexOf('可對照')<i) return; segs.push({k:k, d:pk(k), ok:!!idx[n]}); }); });
      var due=segs.filter(function(s){ return s.d<=today; });
      return {bk:bk, t:BOOK_TITLE[bk]||t, n:segs.length, due:due.length, dueDone:due.filter(function(s){ return s.ok; }).length,
        late:due.filter(function(s){ return !s.ok && s.k!==tk; }).length, nx:segs.filter(function(s){ return s.d>today; })[0]||null};
    }).filter(function(r){ return r.n; });
    return {from:from, subj:subj, got:got, all:(PL.papers||[]).length, expN:Object.keys(exp).length, miss:miss, books:books};
  }
  function progressCard(o,st,today,opened,easy,op){

  // 11-10：明天的日程、未來 7 天
  function dayTags(k,bl,easy,prevPh){
    var PD=(window.PLAN&&window.PLAN.days)||{}, pd=PD[k], tags=[], note=pd&&pd.note?String(pd.note):'';
    ((window.PLAN&&window.PLAN.exams)||[]).forEach(function(e){ if(key(new Date(e[0],e[1]-1,e[2]))!==k) return;
      tags.push('<span class="tag ex">📝 '+esc(e[3])+'</span>');
      if(note.indexOf(e[3])===0) note=note.slice(e[3].length).replace(/^[：:・\s]+/,''); });   // 備註開頭就是考試名稱的，不重複寫
    var lt=bl.filter(function(b){ return b.c==='late'; });
    if(lt.length) tags.push('<span class="tag lt">🌙 熬夜補進度 '+lt.length+' 段</span>');
    bl.forEach(function(b){ if(b.f===1 && /補習|資優數學/.test(b.n) && !/學校/.test(b.n)) tags.push('<span class="tag wait">🏫 '+esc(b.n)+' '+esc(blkTime(b))+'</span>'); });

    return {tags:tags, note:note};
  }

  }

  // 跟寵物玩（11-07 使用者：「只要能互動、有反應就好，不需回傳」）：只在家長這邊有反應，不會送到孩子的網站、不用 token
  var PLAYS=[{k:'pat',e:'👋',n:'摸摸牠'},{k:'ball',e:'🎾',n:'丟球'},{k:'treat',e:'🦴',n:'給零食'},{k:'talk',e:'💬',n:'跟牠說話'}];
  var LINES={pat:['好舒服～','再摸一下！','嘿嘿','（蹭蹭你的手）','（瞇眼睛）'],ball:['我接到了！','再丟一次！','（叼回來給你）','看我跳！'],treat:['好好吃！','謝謝！','還要～','（開心地轉圈）']};
  var lastSay='', talkOpen=false;
  function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
  function replyFor(t){
    t=String(t||'');
    if(/加油|努力|考試|科班|會考/.test(t)) return '我會陪他一起加油！';
    if(/讀書|功課|寫|唸/.test(t)) return '他今天有在讀喔，我都看著';
    if(/想你|愛你|喜歡/.test(t)) return '我也最喜歡你了！';
    if(/乖|聽話/.test(t)) return '我很乖！';
    if(/睡|晚安/.test(t)) return '晚安～';
    if(/吃|餓/.test(t)) return '肚子有點餓…';
    return pickOne(['嗯嗯！','我聽到了～','（歪頭）','好喔！','我會跟他說！']);
  }
  function petFrame(cb){   // 森林沒開就先打開，載入好再做動作
    var f=document.getElementById('pvf');
    if(!f){ togglePet(); f=document.getElementById('pvf'); }
    if(!f) return;
    if(f.dataset.ready) cb(); else f.addEventListener('load',function(){ setTimeout(cb,900); },{once:true});
  }
  function react(kind,txt){
    var p=J(lastO||{},'plan.pet.v1',{}).pet; if(!p) return;
    if(p.trip){ lastSay=p.name+' 去'+(p.trip.dest||'旅行')+'了，不在家。'; paintPlay(); return; }
    var line=kind==='talk'?replyFor(txt):pickOne(LINES[kind]||['嗯？']);
    lastSay=(kind==='talk'?'你：'+txt+'　→　':'')+p.name+'：'+line;
    paintPlay();
    petFrame(function(){ anim(kind,line); });
  }
  function paintPlay(){
    var el=document.getElementById('play'); if(!el) return;
    var p=J(lastO||{},'plan.pet.v1',{}).pet; if(!p){ el.innerHTML=''; return; }
    el.innerHTML='<div class="acts four">'+PLAYS.map(function(a){ return '<button type="button" class="act" data-play="'+a.k+'"'+(a.k==='talk'?' aria-pressed="'+talkOpen+'"':'')+'><span>'+a.e+'</span>'+a.n+'</button>'; }).join('')+'</div>'
      +(talkOpen?'<div class="form"><label for="talk-in">想跟'+esc(p.name)+'說什麼？</label><input id="talk-in" type="text" maxlength="40" placeholder="例：要陪他好好讀書喔"><p style="margin:10px 0 0"><button class="btn solid" type="button" id="talk-go">說</button></p></div>':'')
      +'<p class="say" aria-live="polite">'+(lastSay?esc(lastSay):'點上面的按鈕，'+esc(p.name)+'會有反應（森林會自動打開）。')+'</p>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-play]'),function(b){ b.addEventListener('click',function(){
      var k=b.getAttribute('data-play');
      if(k==='talk'){ talkOpen=!talkOpen; paintPlay(); var i=document.getElementById('talk-in'); if(i) i.focus(); return; }
      react(k);
    }); });
    var tg=document.getElementById('talk-go'), ti=document.getElementById('talk-in');
    var say=function(){ var t=(ti.value||'').trim(); if(!t){ toast('先打一句話。'); return; } react('talk',t.slice(0,40)); };
    if(tg) tg.addEventListener('click',say);
    if(ti) ti.addEventListener('keydown',function(e){ if(e.key==='Enter') say(); });
  }

  // 幫他加點（要送到孩子的網站才算數，所以要 token；家長每天合計最多 30 點）
  function paintActs(){
    paintPlay();
    var el=document.getElementById('act'); if(!el) return;
    if(!chan.token){
      el.innerHTML='<p class="sub" style="margin:0">加點要送到他的讀書網站才算數，所以這支手機要先設定一次（最下面「加點設定」）。只想看、跟寵物玩的話不用設定。</p>';
      return;
    }
    var used=todayUsed(), left=Math.max(0,PAR_MAX-used);
    if(pick>left) pick=left;
    if(!pick && left) pick=Math.min(10,left);
    var h='<p class="sub" style="margin:0 0 8px">家長每天合計最多 '+PAR_MAX+' 點：今天已加 <b>'+used+'</b> 點，還能加 <b>'+left+'</b> 點。他下次打開讀書網站時會收到。</p>';
    if(chanErr) h+='<p class="note bad">'+esc(chanErr)+'</p>';
    if(left){
      h+='<div class="chips">'+[5,10,15,20,30].map(function(n){ return '<button type="button" data-n="'+n+'"'+(n>left?' disabled':'')+' aria-pressed="'+(pick===n)+'">+'+n+'</button>'; }).join('')+'</div>'
        +'<div class="form" style="margin-top:0"><label for="pts-why">理由（可以不寫）</label><input id="pts-why" type="text" maxlength="40" placeholder="例：今天全部完成">'
        +'<p style="margin:10px 0 0"><button class="btn solid" type="button" id="pts-go"'+(pick>0?'':' disabled')+'>送出 +'+pick+' 點</button></p></div>';
    } else h+='<p class="note ok">今天已經加滿 '+PAR_MAX+' 點了，明天再加。</p>';
    el.innerHTML=h;
    Array.prototype.forEach.call(el.querySelectorAll('[data-n]'),function(b){ b.addEventListener('click',function(){ pick=+b.getAttribute('data-n'); paintActs(); }); });
    var pg=document.getElementById('pts-go');
    if(pg) pg.addEventListener('click',function(){
      var n=Math.min(pick,Math.max(0,PAR_MAX-todayUsed())); if(!n){ toast('今天已經加滿 30 點了。'); return; }
      var why=(document.getElementById('pts-why').value||'').trim().slice(0,40);
      doSend({id:newId(), t:Date.now(), day:key(d0()), who:chan.who||'家長', kind:'pts', n:n, text:why},'送出 +'+n+' 點！他下次打開讀書網站時會收到。');
    });
  }

  // 設定區
  function paintSetup(){
    var el=document.getElementById('setup-box'); if(!el) return;
    var who=chan.who||'';
    el.innerHTML='<p class="sub" style="margin-top:8px">加點要寫進孩子 GitHub 帳號裡一個專門的「家長頻道」，他的網站才收得到，所以這支手機要有一把鑰匙（token）。只要設定一次；token 只存在這支手機。跟寵物玩不需要設定。</p>'
      +'<label>你是</label><div class="chips">'+['爸爸','媽媽'].map(function(n){ return '<button type="button" data-who="'+n+'" aria-pressed="'+(who===n)+'">'+n+'</button>'; }).join('')+'</div>'
      +'<input id="who-in" type="text" maxlength="8" placeholder="或自己打稱呼" value="'+(who&&who!=='爸爸'&&who!=='媽媽'?esc(who):'')+'">'
      +'<label for="tok-in">GitHub token</label><input id="tok-in" type="password" autocomplete="off" placeholder="'+(chan.token?'已設定（要換才重貼）':'github_pat_…')+'">'
      +'<p style="margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn solid" type="button" id="tok-save">儲存並測試</button>'+(chan.token?'<button class="btn" type="button" id="tok-clear">清掉這支手機的 token</button>':'')+'</p>'
      +'<p class="sub" id="tok-msg" style="margin:8px 0 0"></p>'
      +'<details style="margin-top:8px"><summary style="cursor:pointer;font-size:13px;color:var(--sky)">token 怎麼做（請孩子幫忙）</summary><ol>'
      +'<li>在 GitHub 網站登入孩子的帳號，右上角頭像 → Settings → 最下面 Developer settings。</li>'
      +'<li>Personal access tokens → Fine-grained tokens → Generate new token。名稱寫「家長」，期限選 1 年。</li>'
      +'<li>Permissions 裡找到 <b>Gists</b>，選 <b>Read and write</b>（其他都不用開）→ Generate token。</li>'
      +'<li>複製那串 github_pat_… 貼在上面。<b>不要傳到聊天室、也不要給 Claude。</b></li></ol></details>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-who]'),function(b){ b.addEventListener('click',function(){ chan.who=b.getAttribute('data-who'); saveChan(); paintSetup(); paintActs(); }); });
    document.getElementById('who-in').addEventListener('change',function(e){ var v=e.target.value.trim(); if(v){ chan.who=v.slice(0,8); saveChan(); paintSetup(); } });
    document.getElementById('tok-save').addEventListener('click',function(){
      var v=(document.getElementById('tok-in').value||'').trim(), msg=document.getElementById('tok-msg');
      if(v){ chan.token=v; chan.gist=''; }
      if(!chan.token){ msg.textContent='先貼上 token。'; return; }
      if(!chan.who){ chan.who='家長'; }
      saveChan(); msg.textContent='測試中…';
      gh('/user').then(function(u){
        if(gOwner && u.login!==gOwner){ msg.innerHTML='<span style="color:var(--bad)">這個 token 是 '+esc(u.login)+' 的，不是孩子的帳號（'+esc(gOwner)+'），他的網站讀不到你的互動。</span>'; return; }
        return findChan(false).then(function(id){ msg.innerHTML='<span style="color:var(--ok)">連線成功 ✓　帳號 '+esc(u.login)+(id?'，找到家長頻道':'，第一次送出時會建立家長頻道')+'。</span>'; return refreshChan(); });
      }).catch(function(e){ msg.innerHTML='<span style="color:var(--bad)">沒成功：'+esc(e.message||e)+'</span>'; });
    });
    var tc=document.getElementById('tok-clear');
    if(tc) tc.addEventListener('click',function(){ if(!confirm('清掉這支手機的 token？之後就不能摸摸、留言、加點，要再貼一次。')) return; chan.token=''; chan.gist=''; saveChan(); chanActs=null; paintSetup(); paintActs(); });
  }

  setInterval(function(){ if(!document.hidden && gid) load(); },600000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && gid && Date.now()-lastLoad>180000) load(); });
  // 11-10：番茄鐘剩幾分、現在的時段每分鐘更新（只重畫 #live 那幾行，不重新讀資料）；切回這頁時馬上更新一次
  setInterval(function(){ if(!document.hidden) paintLive(); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) paintLive(); });
  load();
})();
</script>
</body>
</html>
